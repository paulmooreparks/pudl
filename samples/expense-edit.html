<!DOCTYPE html>
<html lang="en">
<head>

  <script src="expenses-app.js" defer></script>
  <script src="../dist/pudl-menu.js" defer></script>

  <header class="topbar">

    <div class="topbar-chrome">
      <button class="theme-toggle" type="button" aria-label="Switch light and dark" onclick="pudlToggleTheme()">◐</button>

  <nav class="app-section-bar" aria-label="Sections">
    <a class="section-tab" href="expenses.html" aria-current="true">Expenses</a>

  </nav>

  <main class="app-main" data-page="expense-edit" style="max-width: 44rem;">

  <div class="toast-region" role="status" aria-live="polite"></div>
