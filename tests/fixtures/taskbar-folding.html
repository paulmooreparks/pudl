<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskbar folding</title><link rel="stylesheet" href="../../dist/pudl.css"><link rel="stylesheet" href="../../dist/pudl-windows.css"><script src="../../dist/pudl-menu.js" defer></script><script src="../../dist/pudl-windows.js" defer></script><style>body{margin:0}.win-host{height:400px}.win-bar{position:fixed;bottom:0;inset-inline:0}.mirror{display:none}.authored-items{display:flex;align-items:center;gap:6px}.authored-items>.win-dock{display:contents}</style></head><body>
<div class="win-host"><div class="win-layer" data-win-layer data-win-menu data-win-default="editor,notes,terminal" data-win-src="#tpl-{key}"></div></div>
<nav class="win-dock mirror" data-win-dock aria-label="Mirror"></nav>
<footer class="win-bar"><button class="btn btn-sm" id="quit" aria-label="Quit preview"><span class="glyph" style="--glyph:var(--glyph-close)" aria-hidden="true"></span><span class="win-bar-label">Quit preview</span></button><nav class="win-dock" data-win-dock aria-label="Windows"></nav><a class="icon-btn" data-win-back href="?" aria-label="Minimize all"></a><a class="icon-btn" data-win-close-all href="?" aria-label="Close all"></a></footer>
<script>
if (new URLSearchParams(location.search).has('wrapped')) {
 const bar=document.querySelector('.win-bar'),dock=bar.querySelector('.win-dock'),region=document.createElement('div');region.className='authored-items';region.setAttribute('data-win-bar-items','');bar.insertBefore(region,bar.firstChild);region.append(document.getElementById('quit'));
 const session=document.createElement('button');session.type='button';session.className='btn btn-sm';session.id='session';session.setAttribute('popovertarget','session-menu');session.setAttribute('aria-label','Session');session.innerHTML='<span class="glyph" style="--glyph:var(--glyph-account)" aria-hidden="true"></span><span class="win-bar-label">Session</span>';region.append(session,dock);
 const menu=document.createElement('div');menu.id='session-menu';menu.className='menu-panel';menu.setAttribute('popover','');menu.setAttribute('role','menu');menu.setAttribute('aria-label','Session actions');menu.innerHTML='<button class="menu-action" type="button">Session details</button>';document.body.append(menu);
}
['editor','notes','terminal','settings'].forEach((key,i)=>{const t=document.createElement('template');t.id='tpl-'+key;t.innerHTML='<section class="win" data-win="'+key+'" data-win-destination="'+key+'" style="--win-x:.1;--win-y:.1;--win-w:.4;--win-h:.4"><header class="win-head"><span class="win-title">'+key+' with a long descriptive title</span><nav class="win-chrome"><button class="win-btn" data-win-action="close" aria-label="Close"></button></nav></header><div class="win-body">Test content</div></section>';if(i===0)t.content.firstChild.setAttribute('data-win-glyph','pencil');document.body.appendChild(t);});
document.addEventListener('pudl:taskbar-activate',e=>{e.preventDefault();e.detail.waitUntil(pudlWindows.open(e.detail.id,e.detail.opener));});
window.addEventListener('load',()=>pudlWindows.configureTaskbar({destinations:[{id:'editor',label:'Editor workspace',glyph:'pencil'},{id:'settings',label:'Application settings',glyph:'gear'}],pins:['settings','editor']}));
</script></body></html>
