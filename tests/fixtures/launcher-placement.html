<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor launcher placement</title>
<link rel="stylesheet" href="../../dist/pudl.css"><style>body{margin:0}.fixture-layout{height:calc(100dvh - 100px);--split-a:320px}.win-bar{position:fixed;bottom:0;width:100%}</style>
<script src="../../dist/pudl-split.js" defer></script><script src="../../dist/pudl-menu.js" defer></script><script src="../../dist/pudl-toolbar.js" defer></script><script src="../../dist/pudl-start.js" defer></script><script src="../../dist/pudl-menubar.js" defer></script><script src="../../dist/pudl-launcher.js" defer></script></head><body>
<header class="topbar"><nav class="menubar" data-menubar data-menubar-ribbon data-menubar-launcher="catalog" aria-label="Harbor menus"><ul data-menubar-source hidden><li>Harbor</li><li data-menu-glyph="comments">Chat<ul><li><button type="button">New conversation</button></li></ul></li><li data-menu-glyph="eye">View<ul><li><button type="button">Zoom</button></li></ul></li></ul>
<ul data-menubar-launcher-actions hidden><li><button id="updates" type="button" data-menu-glyph="download" data-shortcut="Mod+U">Updates&#8230;</button></li><li><button id="settings" type="button" data-menu-glyph="gear" aria-pressed="false">Settings</button></li><li><a id="guide" href="#guide" data-menu-glyph="info">Guide</a></li></ul></nav></header>
<div class="split fixture-layout" id="layout" data-split-pane="second"><div class="split-pane" id="pane"></div><div class="split-handle" aria-label="Resize launcher"></div><main class="split-pane"><h1>Invented workspace</h1><input id="editor" aria-label="Draft" value="Invented draft"><button id="explicit-anchor" class="btn" type="button">Explicit anchor</button><p id="guide-target">Guide content</p></main></div>
<section id="catalog" class="menu-panel start-menu" data-start popover role="dialog" aria-label="Harbor launcher"><header class="popover-head start-header"><div><button id="header-updates" class="btn" type="button">Updates&#8230;</button><button id="header-settings" class="btn" type="button">Settings</button></div><button class="icon-btn" data-launcher-pin type="button" aria-label="Pin">Pin</button><button class="icon-btn" data-launcher-close type="button" aria-label="Close launcher">&times;</button></header><div class="start-search"><input data-start-query aria-label="Find in Harbor" type="search"></div><div class="start-content"><nav data-start-categories aria-label="Categories"><a href="?category=" data-start-category-key="">All</a></nav><ul class="row-list" data-start-items><li class="md-row" data-start-item><button class="md-item" type="button">Invented notes</button></li></ul><p data-start-empty hidden>No matches</p></div></section>
<footer class="win-bar"></footer>
<script>
const fixtureParameters = new URLSearchParams(location.search);
if (fixtureParameters.has('default')) document.querySelector('[data-menubar-launcher-actions]').remove();
if (fixtureParameters.has('extra')) document.querySelector('[data-menubar]').append(document.querySelector('[data-menubar-launcher-actions]').cloneNode(true));
document.documentElement.dir=fixtureParameters.get('dir')||'ltr';
localStorage.setItem('pudl-menubar-ribbon:Harbor menus',fixtureParameters.get('mode')==='menus'?'menus':'ribbon');
window.hits=[]; ['updates','settings','header-updates','header-settings'].forEach(id=>{const b=document.getElementById(id);if(b)b.addEventListener('click',()=>{hits.push(id);if(id==='settings')b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');});});
window.requests=[]; document.addEventListener('pudl:menubar-launcher',e=>requests.push({invoker:e.detail.invoker,focus:e.detail.focus,toggle:e.detail.toggle}));
window.addEventListener('load',()=>{window.fixtureOptions={pane:document.getElementById('pane'),layout:document.getElementById('layout'),invoker:()=>pudlMenubar.launcherButton(),size:{width:720,height:600},anchor:()=>pudlMenubar.launcherButton({visible:true})};if(fixtureParameters.has('anchor'))fixtureOptions.anchor=document.getElementById('explicit-anchor');if(!fixtureParameters.has('native'))pudlLauncher.enhance(document.getElementById('catalog'),fixtureOptions);window.fixtureReady=true;});
</script></body></html>
