<!doctype html><html lang="en"><meta charset="utf-8"><title>Start control tests</title><link rel="stylesheet" href="../../dist/pudl.css"><script src="../../dist/pudl-split.js" defer></script><script src="../../dist/pudl-md.js" defer></script><script src="../../dist/pudl-start.js" defer></script><body><button class="btn" id="open" popovertarget="catalog">Start</button><button id="outside" class="btn">Outside</button><div id="catalog" role="dialog" popover class="menu-panel start-menu" data-start aria-label="Start"><header class="popover-head start-header"><h2 class="popover-title">Start</h2></header><div class="start-search"><form class="md-filter-group start-search-form" role="search"><input class="md-filter" data-start-query type="search" aria-label="Search items"><button class="icon-btn md-filter-go" aria-label="Open first matching item"></button></form><button class="btn btn-sm" data-start-clear type="button"><span class="glyph" style="--glyph:var(--glyph-close)" aria-hidden="true"></span>Clear</button></div><div class="split start-content"><div class="split-pane start-items-pane"><h3 class="md-section-label" data-start-heading>All</h3><ul class="row-list start-items" data-start-items><li class="md-row" data-start-item data-start-category="tools"><a class="md-item start-item" href="#files"><span class="glyph" style="--glyph:var(--glyph-folder)" aria-hidden="true"></span>Files</a></li></ul><p class="empty-state" data-start-empty hidden>No matching items.</p></div><div class="split-handle" aria-label="Resize categories"></div><nav class="split-pane start-categories" data-start-categories aria-label="Categories"><ul class="row-list start-category-list"><li class="md-row"><a class="md-item start-category" href="?category=" data-start-category-key="" aria-current="page"><span data-start-label>All</span><span class="start-category-count" data-start-category-count aria-hidden="true"></span></a></li><li class="md-row"><a class="md-item start-category" href="?category=tools" data-start-category-key="tools"><span data-start-label>Tools</span></a></li></ul></nav></div></div><script>document.addEventListener('DOMContentLoaded', function () { var root=document.getElementById('catalog'), list=root.querySelector('[data-start-items]'); list.insertAdjacentHTML('beforeend', '<li class="md-row" data-start-item data-start-category="create tools" data-start-keywords="draft"><button id="command" type="button" class="btn btn-sm start-item"><span class="glyph" style="--glyph:var(--glyph-plus)" aria-hidden="true"></span>New note</button></li><li class="md-row" data-start-item hidden><a class="md-item start-item" href="#secret">Hidden</a></li><li class="md-row" data-start-item><button disabled class="btn start-item">Disabled</button></li><li class="md-row" data-start-item><a aria-disabled="true" class="md-item start-item" href="#disabled">Unavailable</a></li>'); root.querySelector('#command').addEventListener('click', function () { window.commands=(window.commands||0)+1; }); });</script></body></html>
