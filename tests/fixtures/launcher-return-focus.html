<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command launcher focus</title>
<link rel="stylesheet" href="../../dist/pudl.css"><style>body{margin:0}.fixture-layout{height:280px;--split-a:45%}</style>
<script src="../../dist/pudl-split.js" defer></script><script src="../../dist/pudl-menu.js" defer></script><script src="../../dist/pudl-start.js" defer></script><script src="../../dist/pudl-launcher.js" defer></script></head><body>
<label>Harbor editor <input id="editor-a" value="Invented harbor notes"></label><div id="editor-b" contenteditable="true" tabindex="-1" aria-label="Second editor">Invented second document</div><input id="outside" aria-label="Other editor" value="Other invented content">
<template id="catalog-template"><button class="btn opener" type="button">Open catalog</button><div class="split fixture-layout" data-split-pane="second"><div class="split-pane launcher-pane"></div><div class="split-handle" aria-label="Resize catalog pane"></div><main class="split-pane">Workspace</main></div>
<section class="menu-panel start-menu" data-start popover role="dialog" aria-label="Command catalog"><header class="popover-head start-header"><h2 class="popover-title">Catalog</h2><button class="icon-btn" data-launcher-pin aria-label="Pin catalog" aria-pressed="false"><span class="glyph" style="--glyph:var(--glyph-pin)" aria-hidden="true"></span></button><button class="icon-btn popover-close" data-launcher-close aria-label="Close catalog"></button></header>
<div class="start-search"><input data-start-query type="search" aria-label="Find command"><button data-start-clear>Clear</button></div><div class="split start-content"><div class="split-pane start-items-pane"><ul class="row-list start-items" data-start-items><li class="md-row" data-start-item><button class="md-item destination">Open invented document</button></li></ul><p data-start-empty hidden>No matches</p></div><div class="split-handle" aria-label="Resize categories"></div><nav class="split-pane start-categories" data-start-categories aria-label="Categories"><a href="?category=" data-start-category-key="">All</a></nav></div></section></template>
<script>window.addEventListener('load',function(){
 ['a','b'].forEach(function(key){var host=document.createElement('div');host.id='host-'+key;host.append(document.getElementById('catalog-template').content.cloneNode(true));document.body.append(host);
 var root=host.querySelector('[data-start]'),opener=host.querySelector('.opener');root.id='catalog-'+key;opener.id='launch-'+key;opener.setAttribute('popovertarget',root.id);
 var size=document.createElement('button');size.type='button';size.setAttribute('data-launcher-size','');size.textContent='Size';size.setAttribute('popovertarget','size-'+key);root.querySelector('header').append(size);
 var settings=document.createElement('div');settings.id='size-'+key;settings.className='popover';settings.setAttribute('popover','auto');settings.setAttribute('data-launcher-size-panel','');settings.innerHTML='<label>Width <input type="number" data-launcher-width></label><label>Height <input type="number" data-launcher-height></label>';root.append(settings);
 pudlLauncher.enhance(root,{pane:host.querySelector('.launcher-pane'),layout:host.querySelector('.split'),invoker:opener,compactAt:650,size:{width:520,height:420}});
 root.querySelector('.destination').addEventListener('click',function(){document.getElementById('editor-b').focus();});
 });window.fixtureReady=true;
});</script></body></html>
