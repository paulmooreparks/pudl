<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diffs</title>
  <link rel="stylesheet" href="../../dist/pudl.css">
  <style>body { margin: 16px; max-width: 900px; } .diff { margin-bottom: 24px; }</style>
</head>
<body>
  <section class="diff" id="inline" data-diff-layout="inline" data-diff-choose aria-label="Changes to store.go">
    <p class="diff-summary">1 hunk, 1 line added, 1 removed</p>
    <div class="diff-hunk" role="group" aria-labelledby="h1">
      <div class="diff-hunk-head" id="h1"><code>@@ -40,3 +40,3 @@</code> <span>Hunk 1 of 1</span>
        <span class="diff-hunk-actions"><button class="btn btn-sm" type="button">Stage hunk 1</button></span></div>
      <div class="diff-line" data-diff="same"><span class="diff-no">40</span><span class="diff-no">40</span><span class="diff-sign"></span><span class="diff-choose"></span><code class="diff-text">func open() {</code></div>
      <div class="diff-line" id="del" data-diff="del" role="deletion"><span class="diff-no">41</span><span class="diff-no"></span><span class="diff-sign"><span class="visually-hidden">Removed</span></span><label class="diff-choose"><input type="checkbox" aria-label="Choose line 41"></label><code class="diff-text">  return <del class="diff-word">nil</del></code></div>
      <div class="diff-line" id="add" data-diff="add" role="insertion"><span class="diff-no"></span><span class="diff-no">41</span><span class="diff-sign"><span class="visually-hidden">Added</span></span><label class="diff-choose"><input type="checkbox" id="pick" aria-label="Choose line 41"></label><code class="diff-text">  return <ins class="diff-word">err</ins></code></div>
      <div class="diff-line" data-diff="same"><span class="diff-no">42</span><span class="diff-no">42</span><span class="diff-sign"></span><span class="diff-choose"></span><code class="diff-text">}</code></div>
    </div>
    <div class="diff-fold"><button class="btn btn-sm" type="button">Show 42 unchanged lines</button></div>
  </section>

  <section class="diff" id="split" data-diff-layout="split" aria-label="Changes to notes.md">
    <p class="diff-summary">1 hunk, 2 lines added, 1 removed</p>
    <div class="diff-sides">
      <div class="diff-side" role="region" aria-label="Before notes.md">
        <div class="diff-hunk"><div class="diff-hunk-head"><code>@@ -1,2 +1,3 @@</code></div>
          <div class="diff-line" data-diff="same"><span class="diff-no">1</span><span class="diff-sign"></span><code class="diff-text"># Notes</code></div>
          <div class="diff-line" data-diff="del" role="deletion"><span class="diff-no">2</span><span class="diff-sign"><span class="visually-hidden">Removed</span></span><code class="diff-text">Old line</code></div>
          <div class="diff-line" data-diff="pad" aria-hidden="true"><span class="diff-no"></span><span class="diff-sign"></span><code class="diff-text"></code></div>
        </div>
      </div>
      <div class="diff-side" role="region" aria-label="After notes.md">
        <div class="diff-hunk"><div class="diff-hunk-head"><code>@@ -1,2 +1,3 @@</code></div>
          <div class="diff-line" data-diff="same"><span class="diff-no">1</span><span class="diff-sign"></span><code class="diff-text"># Notes</code></div>
          <div class="diff-line" data-diff="add" role="insertion"><span class="diff-no">2</span><span class="diff-sign"><span class="visually-hidden">Added</span></span><code class="diff-text">New line</code></div>
          <div class="diff-line" data-diff="add" role="insertion"><span class="diff-no">3</span><span class="diff-sign"><span class="visually-hidden">Added</span></span><code class="diff-text">Another new line</code></div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
