name: Skin geometry probe
on:
  push:
    branches: [debug/skin-geometry]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minified: ['0', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/run.js chromium skins taskbar-providers
        env:
          PUDL_MIN: ${{ matrix.minified }}
          PUDL_JOBS: '1'
          PUDL_RUN_OUTPUT: tests/output/probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.minified }}
          path: tests/output/
