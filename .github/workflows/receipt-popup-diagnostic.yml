name: One receipt popup diagnostic

on:
  push:
    branches: ['diagnostic/01072-receipt-popup-20261115']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ad46b82c7dbe78b627b38f8bcb0e1d9b7a96a6c7
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install immutable checkout dependencies
        working-directory: source
        run: npm ci
      - name: Install pinned Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Copy external capture harness
        run: cp -a driver/diagnostics/receipt-popup-linux source/diagnostic
      - name: Execute the single authorized diagnostic
        working-directory: source
        run: python3 diagnostic/supervise.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-popup-linux-diagnostic
          path: source/diagnostic/
          if-no-files-found: error
