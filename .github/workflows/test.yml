name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A push to main reuses the passing result of a pull request that tested the
# same files. The gate records each tree it passes as an artifact named
# tested-tree-<tree hash>, and the reuse job looks that name up.
jobs:
  reuse:
    name: Look for a passing result for the same files
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          for id in $(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree" --jq '.artifacts[] | select(.expired == false) | .workflow_run.id'); do
            url=$(gh api "repos/$REPO/actions/runs/$id" --jq 'select(.conclusion == "success" and .path == ".github/workflows/test.yml" and .head_repository.full_name == .repository.full_name) | .html_url')
            if [ -n "$url" ]; then
              echo "run=$url" >> "$GITHUB_OUTPUT"
              echo "Tree $tree already passed in $url. This run reuses that result." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "No passing result exists for tree $tree. The full gate runs." >> "$GITHUB_STEP_SUMMARY"
  fonts:
    name: Generated font subsets
    needs: reuse
    if: needs.reuse.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r build/fonts-requirements.txt
      - run: python build/fonts.py --check
  generated:
    name: Generated copies and static contracts
    needs: reuse
    if: needs.reuse.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build/skins.js --check --release
      - run: npm run test:static
      - run: node build/minify.js --check
  browsers:
    name: ${{ matrix.target.browser }} ${{ matrix.target.form }} ${{ matrix.shard }}/2
    needs: reuse
    if: needs.reuse.outputs.run == ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - { browser: chromium, form: source }
          - { browser: firefox, form: source }
          - { browser: webkit, form: source }
          - { browser: chromium, form: minified }
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the package version matched by the browser image
        run: node -e 'if (require("playwright/package.json").version !== "1.63.0") throw new Error("Update the pinned browser image with Playwright")'
      - name: Verify container ownership and trust the exact workspace
        run: |
          node -e 'const fs = require("node:fs"), os = require("node:os"); const home = os.homedir(), uid = process.getuid(); if (fs.statSync(home).uid !== uid) throw new Error("Container home must belong to its user"); console.log(JSON.stringify({uid, home}))'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - run: |
          if [ '${{ matrix.target.form }}' = minified ]; then
            export PUDL_MIN=1
          else
            unset PUDL_MIN
          fi
          node tests/run.js ${{ matrix.target.browser }}
        env:
          PUDL_JOBS: '1'
          PUDL_SHARD: ${{ matrix.shard }}/2
          PUDL_SUITE_TIMEOUT: '300'
          PUDL_RUN_REVISION: ${{ github.sha }}
          PUDL_RUN_OUTPUT: tests/output/ci-${{ matrix.target.browser }}-${{ matrix.target.form }}-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-${{ matrix.target.browser }}-${{ matrix.target.form }}-${{ matrix.shard }}
          path: tests/output/ci-${{ matrix.target.browser }}-${{ matrix.target.form }}-${{ matrix.shard }}/
          if-no-files-found: error
  complete:
    name: Complete test gate
    if: always()
    needs: [reuse, fonts, generated, browsers]
    runs-on: ubuntu-latest
    steps:
      - name: Accept the reused result
        if: needs.reuse.outputs.run != ''
        run: echo "Reused ${{ needs.reuse.outputs.run }}"
      - name: Require every prerequisite job
        if: needs.reuse.outputs.run == ''
        env:
          FONTS: ${{ needs.fonts.result }}
          GENERATED: ${{ needs.generated.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: test "$FONTS" = success && test "$GENERATED" = success && test "$BROWSERS" = success
      - uses: actions/checkout@v4
        if: needs.reuse.outputs.run == ''
      - uses: actions/setup-node@v4
        if: needs.reuse.outputs.run == ''
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.run == ''
        with:
          pattern: output-*
          path: tests/output/shards
      - if: needs.reuse.outputs.run == ''
        run: node tests/verify-shards.js tests/output/shards '${{ github.sha }}'
      - name: Record the tree that passed
        id: tree
        if: needs.reuse.outputs.run == ''
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > tested-tree.txt
      - uses: actions/upload-artifact@v4
        if: needs.reuse.outputs.run == ''
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
