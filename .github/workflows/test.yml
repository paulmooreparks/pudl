name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  browsers:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/run.js ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-${{ matrix.browser }}
          path: tests/output/
          if-no-files-found: ignore
