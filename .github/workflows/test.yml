name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  fonts:
    name: Generated font subsets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r build/fonts-requirements.txt
      - run: python build/fonts.py --check
  browsers:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/run.js ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-${{ matrix.browser }}
          path: tests/output/
          if-no-files-found: ignore
